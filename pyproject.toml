[project]
name = "alation-rdf-sync"
version = "1.0.0"
description = "Scheduled adapter for the Alation -> Stardog bridge"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "asyncpg>=0.29", "pyyaml>=6.0"]

[project.optional-dependencies]
agent = ["anthropic>=0.39"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
alation-rdf-sync = "alation_rdf_sync.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alation_rdf_sync"]
